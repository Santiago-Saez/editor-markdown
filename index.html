<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Editor — una sola página</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a22;
    --panel2: #1c2230;
    --border: #2a3348;
    --text: #e6e9ef;
    --muted: #9aa4b8;
    --accent: #4f8cff;
    --ok: #3ecf8e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header h1 span { color: var(--muted); font-weight: 450; }
  .toolbar { display: flex; gap: 6px; flex-wrap: wrap; }
  .toolbar button, .actions button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px;
  }
  .toolbar button:hover, .actions button:hover { border-color: var(--accent); }
  .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #status { font-size: 12px; color: var(--muted); min-width: 150px; text-align: right; }
  #status.saved { color: var(--ok); }
  .sync-toggle { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .pane-label {
    padding: 8px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); border-bottom: 1px solid var(--border); background: var(--panel);
  }
  #editor {
    flex: 1; resize: none; border: 0; outline: none;
    background: #0b0e13; color: var(--text);
    padding: 16px; font-size: 14px; line-height: 1.6;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    tab-size: 2;
  }
  #preview {
    flex: 1; overflow-y: auto; padding: 20px 24px; background: #fff; color: #1a1d23;
  }
  /* ---- Estilos del documento renderizado (se reutilizan en export) ---- */
  #preview h1, #preview h2, #preview h3, #preview h4, #preview h5, #preview h6,
  .md-body h1, .md-body h2, .md-body h3, .md-body h4, .md-body h5, .md-body h6 {
    line-height: 1.25; margin: 1.2em 0 .5em; font-weight: 700;
  }
  #preview h1, .md-body h1 { font-size: 2em; border-bottom: 1px solid #e5e8ef; padding-bottom: .3em; }
  #preview h2, .md-body h2 { font-size: 1.5em; border-bottom: 1px solid #e5e8ef; padding-bottom: .3em; }
  #preview a, .md-body a { color: #2563eb; }
  #preview code, .md-body code {
    background: #eef1f6; padding: .2em .4em; border-radius: 6px; font-size: .9em;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  #preview pre, .md-body pre {
    background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 10px; overflow-x: auto;
  }
  #preview pre code, .md-body pre code { background: transparent; padding: 0; color: inherit; }
  #preview blockquote, .md-body blockquote {
    margin: 1em 0; padding: .2em 1em; border-left: 4px solid #cbd5e1; color: #475569;
    background: #f8fafc;
  }
  #preview table, .md-body table { border-collapse: collapse; width: 100%; margin: 1em 0; }
  #preview th, #preview td, .md-body th, .md-body td {
    border: 1px solid #d6dbe5; padding: 8px 10px; text-align: left; font-size: 14px;
  }
  #preview th, .md-body th { background: #f1f5f9; }
  #preview img, .md-body img { max-width: 100%; border-radius: 8px; }
  #preview hr, .md-body hr { border: 0; border-top: 1px solid #e2e8f0; margin: 1.5em 0; }
  #preview ul, #preview ol, .md-body ul, .md-body ol { padding-left: 1.6em; }
  #preview li, .md-body li { margin: .25em 0; }
  .hint { padding: 8px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); background: var(--panel); }
  .hint kbd { background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>Markdown <span>/ vista previa + export seguro</span></h1>
  <div class="toolbar">
    <button data-act="bold" title="Negrita (Ctrl+B)"><b>B</b></button>
    <button data-act="italic" title="Cursiva (Ctrl+I)"><i>I</i></button>
    <button data-act="link" title="Enlace (Ctrl+K)">🔗</button>
    <button data-act="code" title="Código">‹›</button>
    <button data-act="h1" title="Título">#</button>
    <button data-act="ul" title="Lista">• List</button>
    <button data-act="quote" title="Cita">❝</button>
  </div>
  <div class="actions">
    <label class="sync-toggle"><input type="checkbox" id="syncToggle" checked> sync scroll</label>
    <button id="btnCopyHtml">Copiar HTML</button>
    <button id="btnExport">Exportar HTML</button>
    <button id="btnClear">Limpiar</button>
    <span id="status">Sin cambios</span>
  </div>
</header>

<main>
  <section class="pane">
    <div class="pane-label">Markdown — pega sin miedo, se sanea</div>
    <textarea id="editor" placeholder="# Hola&#10;&#10;Pega Markdown de internet, se renderiza saneado…" spellcheck="false"></textarea>
  </section>
  <section class="pane">
    <div class="pane-label">Vista previa (saneada)</div>
    <div id="preview" class="md-body"></div>
  </section>
</main>
<div class="hint">
  <kbd>Ctrl/Cmd+B</kbd> negrita · <kbd>Ctrl/Cmd+I</kbd> cursiva · <kbd>Ctrl/Cmd+K</kbd> enlace ·
  <kbd>Tab</kbd> indenta lista · <kbd>Shift+Tab</kbd> saca indentación · Guardado automático en localStorage.
</div>

<script>
"use strict";
/* =====================================================================
   ESTRATEGIA ANTI-XSS (sin dependencias, sin build):
   1. Nunca se inserta HTML del usuario con innerHTML directamente.
   2. Todo texto Markdown se escapa primero (& < > " ').
   3. El parser solo genera un subconjunto cerrado de etiquetas seguras:
      h1-h6, p, strong, em, del, code, pre, a, img, ul, ol, li, blockquote,
      hr, table, thead, tbody, tr, th, td, br, input[checkbox disabled].
   4. No se permite HTML crudo del Markdown: <script>, <img onerror>,
      <svg>, etc. quedan escapados como texto.
   5. URLs (a[href], img[src]) pasan por allowlist de protocolos.
   ===================================================================== */

const editor = document.getElementById("editor");
const preview = document.getElementById("preview");
const status = document.getElementById("status");
const syncToggle = document.getElementById("syncToggle");
const LS_KEY = "md-editor-content-v1";

const SAMPLE = `# Editor Markdown seguro

Pega Markdown de internet sin miedo: el HTML crudo se escapa y las URLs se validan.

## Formato

**negrita** con Ctrl+B, *cursiva* con Ctrl+I, \`código\`, ~~tachado~~ y [enlace](https://example.com) con Ctrl+K.

> Intento de XSS como cita: <script>alert(1)<\/script> se ve como texto.

## Lista (prueba Tab aquí)

- primer punto
- segundo punto
  - subpunto indentado con Tab

1. ordenada uno
2. ordenada dos

- [ ] tarea pendiente
- [x] tarea hecha

## Código

\`\`\`js
console.log("hola <b>mundo</b>"); // las etiquetas se ven, no se ejecutan
\`\`\`

## Tabla

| Nombre | Rol |
| ------ | --- |
| Ana    | dev |
| Luis   | ops |

![gato](https://example.com/gato.png)

---

Enlace malo bloqueado: [click](javascript:alert(1)) no ejecuta nada.
`;

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
}
function escapeAttr(s) { return escapeHtml(s).replace(/`/g, "&#96;"); }

/* Solo http, https, mailto y rutas relativas / anclas. Todo lo demás -> "#" */
function sanitizeUrl(raw) {
  const u = (raw || "").trim();
  if (!u) return "#";
  if (/^(#|\/|\.\/|\.\.\/)/.test(u)) return u.includes('"') || u.includes("'") || u.includes(" ") ? "#" : u;
  const m = /^([a-zA-Z][a-zA-Z0-9+.-]*):/.exec(u);
  if (!m) {
    // relativa sin protocolo: sin espacios ni comillas
    return /[\s"'<>`]/.test(u) ? "#" : u;
  }
  const proto = m[1].toLowerCase();
  if (proto === "http" || proto === "https" || proto === "mailto") {
    return /[\s"'<>`]/.test(u) ? "#" : u;
  }
  return "#"; // bloquea javascript:, data:, vbscript:, file:, blob:, etc.
}

/* Para <img>: igual que enlaces pero además permite data:image/png|jpeg|gif|webp */
function sanitizeImgSrc(raw) {
  const u = (raw || "").trim();
  if (/^data:image\/(png|jpeg|jpg|gif|webp);base64,[a-zA-Z0-9+/=]+$/.test(u)) return u;
  if (/^data:/i.test(u)) return "#";
  return sanitizeUrl(u);
}

/* ---------- inline: opera sobre texto YA escapado ---------- */
function inlineParse(escaped) {
  const codeStash = [];
  // 1. code spans `...` -> stash para no procesar dentro
  escaped = escaped.replace(/`([^`\n]+?)`/g, (m, c) => {
    codeStash.push("<code>" + c + "</code>");
    return "\u0000" + (codeStash.length - 1) + "\u0000";
  });
  // 2. imágenes ![alt](src) — admite un nivel de paréntesis en la URL
  escaped = escaped.replace(/!\[([^\]\n]*)\]\(((?:[^()\s]|\([^()]*\))+)(?:\s+&quot;.*?&quot;)?\)/g, (m, alt, src) => {
    const safe = sanitizeImgSrc(src.replace(/&amp;/g, "&"));
    return '<img alt="' + alt.slice(0, 300) + '" src="' + escapeAttr(safe) + '" loading="lazy">';
  });
  // 3. enlaces [texto](url)
  escaped = escaped.replace(/\[([^\]\n]*)\]\(((?:[^()\s]|\([^()]*\))+)(?:\s+&quot;.*?&quot;)?\)/g, (m, text, url) => {
    const safe = sanitizeUrl(url.replace(/&amp;/g, "&"));
    return '<a href="' + escapeAttr(safe) + '" rel="noopener noreferrer nofollow">' + (text || safe) + "</a>";
  });
  // 4. autolinks <https://...> (solo protocolos seguros)
  escaped = escaped.replace(/&lt;(https?:\/\/[^<>\s]+)&gt;/g, (m, url) => {
    const safe = sanitizeUrl(url);
    return '<a href="' + escapeAttr(safe) + '" rel="noopener noreferrer nofollow">' + escapeHtml(url) + "</a>";
  });
  // 5. énfasis (orden: triple, doble, simple)
  escaped = escaped
    .replace(/\*\*\*([^*\n]+?)\*\*\*/g, "<strong><em>$1</em></strong>")
    .replace(/\*\*([^*\n]+?)\*\*/g, "<strong>$1</strong>")
    .replace(/__([^_\n]+?)__/g, "<strong>$1</strong>")
    .replace(/\*\*([^*]+?)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|\W)\*([^*\n]+?)\*/g, "$1<em>$2</em>")
    .replace(/(^|\W)_([^_\s][^_\n]*?)_/g, "$1<em>$2</em>")
    .replace(/~~([^~\n]+?)~~/g, "<del>$1</del>");
  // 6. restaurar code spans
  escaped = escaped.replace(/\u0000(\d+)\u0000/g, (m, i) => codeStash[Number(i)] || "");
  return escaped;
}

/* ---------- bloques ---------- */
function isHr(line) { return /^\s{0,3}((\*\s*){3,}|(-\s*){3,}|(_\s*){3,})\s*$/.test(line); }
function headingMatch(line) { return /^(#{1,6})\s+(.*?)(\s+#+\s*)?$/.exec(line); }
function listMatch(line) {
  return /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(line);
}
function taskMatch(content) { return /^\[([ xX])\]\s+(.*)$/.exec(content); }

function parseListBlock(lines) {
  // árbol por indentación (2 espacios = 1 nivel, tab = 2 niveles)
  const root = { children: [], level: -1, ordered: false };
  const stack = [root];
  for (const line of lines) {
    const m = listMatch(line);
    if (!m) continue;
    const indentRaw = m[1].replace(/\t/g, "  ");
    const level = Math.floor(indentRaw.length / 2);
    const ordered = /^\d/.test(m[2]);
    let content = m[3];
    let task = null;
    const t = taskMatch(content);
    if (t) { task = t[1].toLowerCase() === "x"; content = t[2]; }
    const node = { level, ordered, html: inlineParse(escapeHtml(content)), task, children: [] };
    while (stack.length > 1 && stack[stack.length - 1].level >= level) stack.pop();
    // asegura niveles intermedios
    while (stack[stack.length - 1].level < level - 1) {
      const filler = { level: stack[stack.length - 1].level + 1, ordered: false, html: "", children: [] };
      stack[stack.length - 1].children.push(filler);
      stack.push(filler);
    }
    stack[stack.length - 1].children.push(node);
    stack.push(node);
  }
  function render(nodes, ordered) {
    if (!nodes.length) return "";
    const tag = ordered ? "ol" : "ul";
    let out = "<" + tag + ">";
    // agrupa por tipo para no mezclar ol/ul en el mismo nivel
    let group = [], groupOrdered = nodes[0].ordered;
    const flush = () => {
      if (!group.length) return;
      const gtag = groupOrdered ? "ol" : "ul";
      out += "<" + gtag + ">";
      for (const n of group) {
        if (n.html === "" && n.children.length) { out += render(n.children, n.children[0].ordered); continue; }
        out += "<li>";
        if (n.task !== null) {
          out += '<input type="checkbox" disabled' + (n.task ? " checked" : "") + "> ";
        }
        out += n.html;
        if (n.children.length) out += render(n.children, n.children[0].ordered);
        out += "</li>";
      }
      out += "</" + gtag + ">";
      group = [];
    };
    for (const n of nodes) {
      if (n.ordered !== groupOrdered && group.length) { flush(); groupOrdered = n.ordered; }
      group.push(n);
    }
    flush();
    return out.replace(/^<(o|u)l><\1l>|<\/\1l><\/\1l>$/g, (x) => x); // mantiene simple
  }
  // render raíz: evita doble <ul><ul>
  let html = "";
  let group = [], gOrd = null;
  for (const n of root.children) {
    if (gOrd === null) gOrd = n.ordered;
    if (n.ordered !== gOrd) { html += render(group, gOrd); group = []; gOrd = n.ordered; }
    group.push(n);
  }
  if (group.length) html += render(group, gOrd);
  // render() ya envuelve en ul/ol, así que devolvemos tal cual
  return html;
}

function renderMarkdown(src) {
  const lines = (src || "").replace(/\r\n?/g, "\n").split("\n");
  let html = "", i = 0, para = [];

  function flushPara2() {
    if (para.length) {
      html += "<p>" + inlineParse(escapeHtml(para.join("\n"))).replace(/\n/g, "<br>") + "</p>";
      para = [];
    }
  }

  while (i < lines.length) {
    const line = lines[i];

    // fenced code
    if (/^\s*```/.test(line)) {
      flushPara2();
      const lang = (line.trim().slice(3).trim().split(/\s+/)[0] || "").replace(/[^a-zA-Z0-9+-]/g, "").slice(0, 20);
      i++;
      const buf = [];
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++; // salta cierre
      html += '<pre><code' + (lang ? ' class="language-' + lang + '"' : "") + ">"
        + escapeHtml(buf.join("\n")) + "</code></pre>";
      continue;
    }
    // heading
    const h = headingMatch(line);
    if (h) {
      flushPara2();
      const lvl = h[1].length;
      html += "<h" + lvl + ">" + inlineParse(escapeHtml(h[2])) + "</h" + lvl + ">";
      i++; continue;
    }
    // hr
    if (isHr(line)) { flushPara2(); html += "<hr>"; i++; continue; }
    // tabla
    if (line.includes("|") && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?[\s:|-]*$/.test(lines[i + 1]) && lines[i+1].includes("-")) {
      flushPara2();
      const head = line.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes("|") && lines[i].trim() !== "") {
        rows.push(lines[i].trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim()));
        i++;
      }
      html += "<table><thead><tr>" + head.map(c => "<th>" + inlineParse(escapeHtml(c)) + "</th>").join("") + "</tr></thead><tbody>"
        + rows.map(r => "<tr>" + r.map(c => "<td>" + inlineParse(escapeHtml(c)) + "</td>").join("") + "</tr>").join("")
        + "</tbody></table>";
      continue;
    }
    // blockquote (grupo)
    if (/^\s*>/.test(line)) {
      flushPara2();
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) { buf.push(lines[i].replace(/^\s*> ?/, "")); i++; }
      html += "<blockquote>" + renderMarkdown(buf.join("\n")) + "</blockquote>";
      continue;
    }
    // lista (grupo)
    if (listMatch(line)) {
      flushPara2();
      const buf = [];
      while (i < lines.length && (listMatch(lines[i]) || /^\s*$/.test(lines[i]) === false && /^\s+\S/.test(lines[i]))) {
        if (/^\s*$/.test(lines[i])) break;
        if (!listMatch(lines[i]) && !/^\s+\S/.test(lines[i])) break;
        buf.push(lines[i]); i++;
      }
      html += parseListBlock(buf);
      continue;
    }
    // línea vacía
    if (/^\s*$/.test(line)) { flushPara2(); i++; continue; }
    // párrafo
    para.push(line); i++;
  }
  flushPara2();
  return html;
}

/* ---------- render + scroll sync por posición relativa ---------- */
let syncing = false;
function render() {
  preview.innerHTML = renderMarkdown(editor.value);
}
function syncScroll(from, to) {
  if (!syncToggle.checked || syncing) return;
  const maxFrom = from.scrollHeight - from.clientHeight;
  if (maxFrom <= 0) return;
  const ratio = from.scrollTop / maxFrom;
  const maxTo = to.scrollHeight - to.clientHeight;
  syncing = true;
  to.scrollTop = ratio * maxTo;
  requestAnimationFrame(() => { syncing = false; });
}
editor.addEventListener("scroll", () => syncScroll(editor, preview));
preview.addEventListener("scroll", () => syncScroll(preview, editor));

/* ---------- edición: wrap, atajos, Tab en listas ---------- */
function wrapSelection(before, after, placeholder) {
  const s = editor.selectionStart, e = editor.selectionEnd;
  const sel = editor.value.slice(s, e) || placeholder || "";
  editor.setRangeText(before + sel + after, s, e === s ? s + before.length + sel.length : s, "end");
  if (e === s && placeholder) editor.setSelectionRange(s + before.length, s + before.length + sel.length);
  else editor.setSelectionRange(s + before.length + sel.length + after.length, s + before.length + sel.length + after.length);
  // recoloca cursor dentro si no había selección
  if (e === s) {
    const pos = s + before.length;
    editor.setSelectionRange(pos, pos + sel.length);
  }
  onInput();
  editor.focus();
}
function insertLink() {
  const s = editor.selectionStart, e = editor.selectionEnd;
  const sel = editor.value.slice(s, e);
  const looksUrl = /^(https?:\/\/\S+)$/.test(sel.trim());
  if (!sel) {
    editor.setRangeText("[texto](https://)", s, e, "end");
    editor.setSelectionRange(s + 1, s + 6);
  } else if (looksUrl) {
    editor.setRangeText("[texto](" + sel.trim() + ")", s, e, "end");
    editor.setSelectionRange(s + 1, s + 6);
  } else {
    editor.setRangeText("[" + sel + "](https://)", s, e, "end");
    const urlStart = s + sel.length + 3;
    editor.setSelectionRange(urlStart, urlStart + 8);
  }
  onInput(); editor.focus();
}
function currentLineBounds(pos) {
  const v = editor.value;
  let a = v.lastIndexOf("\n", pos - 1) + 1, b = v.indexOf("\n", pos);
  if (b === -1) b = v.length;
  return [a, b];
}
function handleTab(e) {
  e.preventDefault();
  const outdent = e.shiftKey;
  const s = editor.selectionStart, en = editor.selectionEnd;
  const [ls] = currentLineBounds(s);
  const [, le] = currentLineBounds(en === s ? s : en - 1);
  const block = editor.value.slice(ls, le);
  const multilines = block.includes("\n");
  const isListCtx = block.split("\n").some(l => /^\s*([-*+]|\d+[.)]|\[)/.test(l) || /^\s/.test(l));
  if (multilines || /^\s*([-*+]|\d+[.)])/.test(block.split("\n")[0]) || isListCtx) {
    const lines = block.split("\n");
    const next = lines.map(l => {
      if (outdent) return l.replace(/^(\s{1,2}|\t)/, "");
      return "  " + l;
    }).join("\n");
    editor.setRangeText(next, ls, le, "end");
    editor.setSelectionRange(ls, ls + next.length);
  } else {
    if (outdent) {
      const [a, b] = currentLineBounds(s);
      const line = editor.value.slice(a, b);
      const cut = line.replace(/^(\s{1,2}|\t)/, "");
      editor.setRangeText(cut, a, b, "end");
      editor.setSelectionRange(s - (line.length - cut.length), s - (line.length - cut.length));
    } else {
      editor.setRangeText("  ", s, en, "end");
      editor.setSelectionRange(s + 2, s + 2);
    }
  }
  onInput();
}

editor.addEventListener("keydown", (e) => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && !e.shiftKey && e.key.toLowerCase() === "b") { e.preventDefault(); wrapSelection("**", "**", "negrita"); }
  else if (mod && !e.shiftKey && e.key.toLowerCase() === "i") { e.preventDefault(); wrapSelection("*", "*", "cursiva"); }
  else if (mod && !e.shiftKey && e.key.toLowerCase() === "k") { e.preventDefault(); insertLink(); }
  else if (e.key === "Tab") { handleTab(e); }
});

document.querySelectorAll(".toolbar button").forEach(btn => {
  btn.addEventListener("click", () => {
    const act = btn.dataset.act;
    if (act === "bold") wrapSelection("**", "**", "negrita");
    if (act === "italic") wrapSelection("*", "*", "cursiva");
    if (act === "link") insertLink();
    if (act === "code") wrapSelection("`", "`", "código");
    if (act === "h1") wrapSelection("## ", "", "Título");
    if (act === "ul") wrapSelection("- ", "", "punto de lista");
    if (act === "quote") wrapSelection("> ", "", "cita");
  });
});

/* ---------- guardado automático con debounce + aviso ---------- */
let saveTimer = null;
function setStatus(text, saved) {
  status.textContent = text;
  status.classList.toggle("saved", !!saved);
}
function saveNow() {
  try {
    localStorage.setItem(LS_KEY, editor.value);
    const t = new Date().toLocaleTimeString();
    setStatus("Guardado ✓ " + t, true);
  } catch { setStatus("No se pudo guardar (localStorage lleno/bloqueado)", false); }
}
function onInput() {
  render();
  setStatus("Escribiendo…", false);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 600);
}
editor.addEventListener("input", onInput);

/* ---------- exportar HTML autocontenido ---------- */
const EXPORT_CSS = `
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;max-width:800px;margin:2rem auto;padding:0 1.2rem;color:#1a1d23;line-height:1.65}
h1{font-size:2em;border-bottom:1px solid #e5e8ef;padding-bottom:.3em}h2{font-size:1.5em;border-bottom:1px solid #e5e8ef;padding-bottom:.3em}
a{color:#2563eb}code{background:#eef1f6;padding:.2em .4em;border-radius:6px;font-size:.9em}
pre{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:10px;overflow-x:auto}pre code{background:transparent;padding:0;color:inherit}
blockquote{margin:1em 0;padding:.2em 1em;border-left:4px solid #cbd5e1;color:#475569;background:#f8fafc}
table{border-collapse:collapse;width:100%;margin:1em 0}th,td{border:1px solid #d6dbe5;padding:8px 10px;text-align:left}th{background:#f1f5f9}
img{max-width:100%;border-radius:8px}hr{border:0;border-top:1px solid #e2e8f0;margin:1.5em 0}ul,ol{padding-left:1.6em}li{margin:.25em 0}`;

function buildExportDoc(title) {
  const body = renderMarkdown(editor.value); // ya saneado por construcción
  const safeTitle = escapeHtml(title || "Documento Markdown");
  return "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"UTF-8\">\n"
    + '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n'
    + "<title>" + safeTitle + "</title>\n<style>" + EXPORT_CSS + "</style>\n</head>\n<body>\n"
    + body + "\n</body>\n</html>";
}
document.getElementById("btnExport").addEventListener("click", () => {
  const firstH1 = /^\s*#\s+(.+)/m.exec(editor.value);
  const name = (firstH1 ? firstH1[1].trim().slice(0, 40) : "documento").replace(/[^\wáéíóúñü-]+/gi, "-") || "documento";
  const blob = new Blob([buildExportDoc(firstH1 ? firstH1[1] : "Documento")], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name + ".html";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  saveNow();
});
document.getElementById("btnCopyHtml").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(renderMarkdown(editor.value));
    setStatus("HTML copiado ✓", true);
  } catch { setStatus("No se pudo copiar", false); }
});
document.getElementById("btnClear").addEventListener("click", () => {
  if (confirm("¿Borrar el contenido del editor?")) {
    editor.value = "";
    onInput(); saveNow();
  }
});

/* ---------- init ---------- */
(function init() {
  const saved = localStorage.getItem(LS_KEY);
  editor.value = saved !== null ? saved : SAMPLE;
  render();
  setStatus(saved !== null ? "Recuperado de localStorage ✓" : "Contenido de ejemplo", true);
})();
</script>
</body>
